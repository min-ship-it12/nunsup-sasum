<style>html,body{margin:0;height:100%;background:#c9d9d3}.deer{--ink:#24413f;--chip:rgba(255,255,255,.72);--chip-on:#2f5a57;--chip-on-fg:#fff;position:relative;overflow:hidden;background:#c9d9d3;color:var(--ink);font-family:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.deer .stage{position:absolute;inset:0;overflow:hidden;touch-action:manipulation;cursor:pointer}
.deer .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.05);opacity:.9}
.deer .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.deer .frame.wide{box-shadow:0 10px 50px rgba(30,60,60,.25)}
.deer .frame img,.deer .frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.deer .frame img.pic0{visibility:hidden}
.deer .ttl{position:absolute;top:14px;left:14px;pointer-events:none;background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px 7px;border-radius:14px;box-shadow:0 2px 12px rgba(30,60,60,.15)}
.deer h1{font-family:"Gowun Batang",ui-serif,serif;font-weight:700;font-size:1.35rem;letter-spacing:.06em;margin:0;color:var(--ink);}
.deer .ttl p{margin:.1rem 0 0;font-size:.78rem;opacity:.75}
.deer .panel{position:absolute;left:14px;top:84px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 28px)}
.deer .row{display:flex;gap:4px;flex-wrap:wrap;background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px;border-radius:999px;box-shadow:0 2px 12px rgba(30,60,60,.15)}
.deer .row span{font-size:.72rem;letter-spacing:.08em;padding:6px 4px 6px 9px;opacity:.6}
.deer button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
.deer button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.deer button.run{background:#b0683a;color:#fff}
.deer button.look{background:#2f5a57;color:#fff;margin-left:2px}
.deer button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.deer .hint{position:absolute;left:50%;transform:translateX(-50%);top:232px;font-size:.78rem;background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity 1.2s;white-space:nowrap}

.deer,.deer button{font-family:Jua,"Gowun Dodum",system-ui,sans-serif}.deer h1{font-family:Jua,serif;font-weight:400;letter-spacing:.04em}.deer{position:fixed;inset:0}</style>
</head>

<script>// ===== 사슴 인형 (procedural deer rig) =====
// 단위 u = 어깨 높이(땅~기갑). 사슴 로컬 좌표: 오른쪽(+x)을 봄, 땅 y=0, 위는 -y.
(function(G){
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=v=>v-Math.floor(v);
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---- 걸음새 ----
// 다리 순서: 0 앞-가까운, 1 앞-먼, 2 뒤-가까운, 3 뒤-먼
const GAITS={
 stand:{off:[0,.5,.5,0],duty:1,lift:[0,0],fold:[0,0],freq:v=>1,bob:0,anchor:[0,0]},
 walk:{off:[.25,.75,0,.5],duty:.64,lift:[.11,.09],fold:[.8,.45],freq:v=>.75+.45*v,bob:.018,anchor:[.01,.05]},
 trot:{off:[.5,0,0,.5],duty:.42,lift:[.2,.16],fold:[1.2,.75],freq:v=>1.55+.25*v,bob:.04,anchor:[.03,.07]},
 bound:{off:[.50,.56,.92,.965],duty:.24,lift:[.26,.22],fold:[2.1,1.25],freq:v=>1.45+.07*v,bob:0,anchor:[.1,.06]},
 stot:{off:[0,.03,.02,.05],duty:.34,lift:[.12,.12],fold:[.25,.2],freq:v=>1.55,bob:0,anchor:[.02,0]},
};

// ---- 용수철 ----
function Spring(v,k,d){this.v=v;this.t=v;this.vel=0;this.k=k||60;this.d=d||12;}
Spring.prototype.step=function(dt){const a=(this.t-this.v)*this.k-this.vel*this.d;this.vel+=a*dt;this.v+=this.vel*dt;return this.v;};

// ---- 2-뼈 IK ----
function ik2(ax,ay,bx,by,l1,l2,bend){ // bend: +1 관절이 앞(+x)쪽, -1 뒤쪽
 let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);
 const md=l1+l2-1e-4;if(d>md){dx*=md/d;dy*=md/d;d=md;}
 if(d<Math.abs(l1-l2)+1e-4)d=Math.abs(l1-l2)+1e-4;
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
 const ux=dx/d,uy=dy/d;
 // 수직 벡터: 방향 (ux,uy)을 오른쪽(+x)으로 기울이는 쪽
 let px=-uy,py=ux; if(px*bend<0){px=-px;py=-py;}
 return {x:ax+ux*a+px*h,y:ay+uy*a+py*h,ex:ax+dx,ey:ay+dy};
}

// ---- 색 ----
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(c,d,t){return[c[0]+(d[0]-c[0])*t,c[1]+(d[1]-c[1])*t,c[2]+(d[2]-c[2])*t];}
function css(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function mul(c,k){return[c[0]*k,c[1]*k,c[2]*k];}

const PAL={
 doe:{body:'#bb7a42',back:'#9a5f33',belly:'#ecdcc4',leg:'#bb7a42',far:'#dcc4a3',hoof:'#4a3328',nose:'#33251f',ear:'#f0e2cc',dark:'#6f4a2e'},
 buck:{body:'#a96c3b',back:'#86532d',belly:'#e6d4ba',leg:'#a96c3b',far:'#d2b896',hoof:'#3e2b22',nose:'#2e211b',ear:'#ead9c0',dark:'#5e3f27',antler:'#eadcc2'},
 fawn:{body:'#c6874d',back:'#a96d3b',belly:'#f1e3cd',leg:'#c6874d',far:'#e2cbab',hoof:'#4a3328',nose:'#33251f',ear:'#f4e8d4',dark:'#76502f',spot:'#f6ecdc'},
};

// ---- 사슴 ----
function Deer(o){
 o=o||{};
 this.kind=o.kind||'doe';
 this.x=o.x||0;this.z=o.z||.5; // 땅 위치 (x: u 단위, z: 깊이 0앞~1뒤)
 this.face=o.face||1;this.fx=this.face; // 보는 방향 / 뒤돌기용 가로 배율
 this.turnT=0;this.turning=0;

let lum=null;
function readLum(){try{const c=document.createElement('canvas');c.width=IW/4;c.height=IH/4;const x=c.getContext('2d');x.drawImage(bgImg,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;lum=new Uint8Array(c.width*c.height);for(let i=0;i<lum.length;i++)lum[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;}catch(e){lum=null;return;}
 for(const m of herd)if(!m.mom&&(!okSpot(m.pos.x,-m.pos.z)||crowded(m.pos.x,-m.pos.z,m))){const p=findSpot(m.pos.x,-m.pos.z,6,8,m);m.pos.set(p[0],0,-p[1]);if(m.kid)m.kid.pos.set(p[0]+rnd(-1,1),0,-p[1]-rnd(.3,1));}}

// 나무 밑동 근처(반쯤 가려져 이상해 보이는 곳)는 들어가지 않음
function rootZone(x,d){if(d<1)return false;const[X,Y]=proj(x,d),hw=.7*F/d;for(const st of OCC.s){if(st[0]+OCC.w<X-hw||st[0]>X+hw)continue;if(Y>=st[2]&&Y<=st[1]+34)return true;}return false;}
// 화면 옆으로 드나들 때 나무 밑동을 지나지 않는 깊이
function edgeD(side,d){for(let k=0;k<40;k++){const dd=clamp(d+(k%2?1:-1)*Math.ceil(k/2)*.8,DN+.5,DF+4),[l,r]=xLim(dd);let ok=true;for(let s=.3;s<4.5;s+=.7)if(rootZone(side<0?l+s:r-s,dd)){ok=false;break;}if(ok)return dd;}return DN+1;}
function okSpot(x,d){if(d<DN||d>DF)return false;if(rootZone(x,d))return false;if(!lum)return true;const[X,Y]=proj(x,d);if(X<0||X>=IW)return true;

function crowded(x,d,me){for(const h of herd){if(h===me||h.ai.m==='away'||h.mom===me||(me&&me.mom===h))continue;if(Math.hypot(h.pos.x-x,-h.pos.z-d)<1.3)return true;}return false;}
function findSpot(x0,d0,rx,rd,me){let best=null;for(let i=0;i<18;i++){const d=clamp(d0+rnd(-rd,rd),DN+.5,DF-1),[l,r]=xLim(d),x=clamp(x0+rnd(-rx,rx),l+.6,r-.6);if(okSpot(x,d)){if(!crowded(x,d,me))return[x,d];best=best||[x,d];}}return best||[x0,d0];}

const herd=[];let target=24;
function makeDeer(kind){const c=new Deer({kind});const m=new DeerModel(c,'storybook',{lite:true});m.ai={m:'idle',t:rnd(0,4),sub:'graze'};c.pose.head='graze';S.add(m.root);herd.push(m);return m;}
function spawn(kind,x,d){const m=makeDeer(kind);if(x==null){d=DN+1+(DF-DN-3)*Math.pow(Math.random(),1.25);const[l,r]=xLim(d);x=rnd(l+.6,r-.6);const p=findSpot(x,d,8,6,m);x=p[0];d=p[1];}
 m.pos.set(x,0,-d);m.heading=rnd(0,TAU);return m;}
function populate(n){
 let live=herd.filter(m=>m.ai.m!=='leave');
 while(live.length<n){
  const moms=live.filter(m=>m.kind==='doe'&&!m.kid);const r=Math.random();let m;
  if(r<.3&&moms.length){const mo=pick(moms);m=spawn('fawn',mo.pos.x+rnd(-1,1),-mo.pos.z+rnd(.3,1));m.mom=mo;mo.kid=m;}
  else m=spawn(r<.5?'buck':'doe');
  live.push(m);if(started){m.ai={m:'away',t:rnd(.2,3)};m.root.visible=false;}
 }
 // 줄일 때: 걸어서 화면 밖으로
 if(live.length>n){
  const extra=live.slice().sort((a,b)=>(a.mom?-1:0)-(b.mom?-1:0)||Math.random()-.5).slice(0,live.length-n);
  for(const m of extra)leave(m);
 }
}
function leave(m){
 if(m.ai.m==='away'){remove(m);return;}
 const d0=-m.pos.z,[l0,r0]=xLim(d0),side=m.pos.x<(l0+r0)/2?-1:1,d=edgeD(side,d0+rnd(-2,2)),[l,r]=xLim(d);
 goTo(m,side<0?l-3:r+3,d,rnd(1.7,2.5),'leave');
 if(m.kid&&m.kid.ai.m!=='leave'){goTo(m.kid,side<0?l-3.5:r+3.5,d,1.5,'leave');m.kid.mom=null;m.kid=null;}
}
function remove(m){S.remove(m.root);const i=herd.indexOf(m);if(i>=0)herd.splice(i,1);if(m.mom&&m.mom.kid===m)m.mom.kid=null;if(m.kid)m.kid.mom=null;}
